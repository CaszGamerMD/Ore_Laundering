name: Build Fabric jar
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Verify molten liquid colors and WAILA overlay status plugins
        run: python3 scripts/check_molten_and_overlays.py
      - name: Build
        run: gradle build --stacktrace
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ore-Laundering-Fabric-26.2
          path: build/libs/ore-laundering-*.jar
          if-no-files-found: error
      - name: Publish Ore Laundering dev release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: Ore Laundering Dev Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            build/libs/ore-laundering-*.jar
            !build/libs/*-sources.jar
